<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaowen Ma | Digital Artist</title>
  <link rel="stylesheet" href="MaMXW.css">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #0a0a0a;
      font-family: 'Urbanist', sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .bg-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 32, 112, 0.15) 0%, transparent 50%);
      z-index: 2;
      pointer-events: none;
    }

    .artwork-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .artwork-particle {
      position: absolute;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6));
      transform-style: preserve-3d;
      transition: opacity 4s ease-in-out, transform 12s linear;
    }

    .artwork-particle.active {
      opacity: 0.23;
    }

    header, main, footer {
      position: relative;
      z-index: 3;
    }

    .btn-custom {
      position: relative;
      padding: 18px 45px;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: transparent;
      border: 2px solid #e62070;
      border-radius: 50px;
      transition: 0.4s;
      font-weight: 700;
      display: inline-block;
      overflow: hidden;
    }

    .btn-custom:hover {
      background: #e62070;
      box-shadow: 0 0 30px rgba(230, 32, 112, 0.6);
      transform: scale(1.05);
    }

    .hero-title {
      font-size: 4.5rem;
      line-height: 1.1;
      background: linear-gradient(to right, #fff, #e62070);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .hero-title { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="artwork-particles" id="particle-container"></div>

  <header>
    <nav>
      <div class="logo" style="font-weight: 700; letter-spacing: 1px;">
        MA <span style="color: #e62070;">XW</span> ART.
      </div>
      <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main style="max-width: 1000px; margin: 15vh auto; text-align: center; padding: 0 20px;">
    <div style="margin-bottom: 20px; opacity: 0.6; letter-spacing: 5px; font-size: 0.9rem; color: white;">
        DIGITAL ARCHITECT & MODELER
    </div>

    <h1 class="hero-title">SHAPING<br>VIRTUAL REALITY</h1>

    <p style="font-size: 1.4rem; color: #bbb; margin-bottom: 50px; font-weight: 300; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">
      Hi, I'm <span style="color: #fff; font-weight: 700;">Xiaowen Ma</span>. <br>
      Building immersive 3D experiences from the ground up.
    </p>

    <a href="projects.html" class="btn-custom">
      VIEW MY GALLERY
    </a>

    <div style="margin-top: 100px; opacity: 0.3;">
        <div style="width: 2px; height: 50px; background: linear-gradient(to bottom, #e62070, transparent); margin: 0 auto;"></div>
    </div>
  </main>

  <footer style="margin-top: 50px; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.05); text-align: center;">
    <p style="margin-bottom: 10px;">
        <a href="contact.html" style="color: #888; text-decoration: none; font-size: 0.9rem; transition: 0.3s;" onmouseover="this.style.color='#e62070'" onmouseout="this.style.color='#888'">GET IN TOUCH</a>
    </p>
    <p style="color: #555; font-size: 0.8rem;">&copy; 2026 Xiaowen Ma. All rights reserved.</p>
  </footer>

  <script>
    const glow = document.querySelector('.bg-glow');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(230, 32, 112, 0.15) 0%, transparent 50%)`;
    });

    const container = document.getElementById('particle-container');
    const imageSources = [
      'assets/cover.jpg', 'assets/cover1.jpg', 'assets/cover2.jpg', 'assets/cover3.jpg',
      'assets/cover4.jpg', 'assets/cover5.jpg', 'assets/cover6.jpg', 'assets/cover7.jpg'
    ];
    const particles = [];
    const maxParticles = 12;

    function createParticle() {
      if (particles.length >= maxParticles) return;

      const img = document.createElement('img');
      img.src = imageSources[Math.floor(Math.random() * imageSources.length)];
      img.className = 'artwork-particle';
      img.alt = 'Artwork Piece';
      img.style.objectFit = 'contain';

      const size = 12 + Math.random() * 8;
      img.style.width = `${size}vw`;

      const startX = Math.random() * 80 + 10;
      const startY = Math.random() * 80 + 10;
      img.style.left = `${startX}%`;
      img.style.top = `${startY}%`;

      const startRotate = (Math.random() - 0.5) * 40;
      img.style.transform = `translate(-50%, -50%) rotate(${startRotate}deg) scale(0.8)`;

      container.appendChild(img);
      particles.push(img);

      setTimeout(() => {
        img.classList.add('active');

        const moveX = (Math.random() - 0.5) * 15;
        const moveY = (Math.random() - 0.5) * 15;
        const endRotate = startRotate + (Math.random() - 0.5) * 30;

        img.style.transform = `translate(calc(-50% + ${moveX}vw), calc(-50% + ${moveY}vh)) rotate(${endRotate}deg) scale(1.05)`;
      }, 50);
    }

    for(let i = 0; i < 6; i++) {
      setTimeout(createParticle, i * 600);
    }

    setInterval(createParticle, 3000);

    setInterval(() => {
      if (particles.length > 6) {
        const oldest = particles.shift();
        oldest.classList.remove('active');
        setTimeout(() => { oldest.remove(); }, 4000);
      }
    }, 3000);
  </script>
</body>
</html>
