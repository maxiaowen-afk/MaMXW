<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaowen Ma | Digital Artist</title>
  <link rel="stylesheet" href="MaMXW.css">
  <link href="https://fonts.googleapis.com/css2 family=Urbanist:wght@300;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #0a0a0a;
      font-family: 'Urbanist', sans-serif;
      overflow: hidden; /* 防止粒子超出屏幕产生滚动条 */
      margin: 0;
    }

    /* 鼠标交互光晕层 - 提高 z-index 确保叠加在粒子之上 */
    .bg-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 32, 112, 0.15) 0%, transparent 50%);
      z-index: 2; /* 放在所有内容的底层，但粒子之上 */
      pointer-events: none;
    }

    /* 纸片艺术粒子容器 */
    .artwork-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* 放在光晕和内容的下面 */
      pointer-events: none;
      overflow: hidden;
    }

    /* 单个“纸片”粒子的样式 */
    .artwork-particle {
      position: absolute;
      width: auto;
      height: auto;
      object-fit: contain; /* 保证全画幅不裁剪 */
      pointer-events: none;
      opacity: 0; /* 初始隐藏，通过动画淡入 */

      /* 添加纸片般的轻微投影，使其更立体 */
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));

      /* 基础变换：大小和旋转 */
      transform-style: preserve-3d;

      /* 淡入淡出和基础变换动画 */
      transition: opacity 3s ease-in-out, transform 3s ease-in-out;
    }

    /* 当粒子活动时的状态：控制最高透明度 23% */
    .artwork-particle.active {
      opacity: 0.23; /* 20%-25% 视觉效果最神秘高级 */
    }

    /* 核心内容容器 - 最高 z-index */
    header, main, footer {
      position: relative;
      z-index: 3;
    }

    .btn-custom {
      position: relative;
      padding: 18px 45px;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: transparent;
      border: 2px solid #e62070;
      border-radius: 50px;
      transition: 0.4s;
      font-weight: 700;
      display: inline-block;
      overflow: hidden;
    }

    .btn-custom:hover {
      background: #e62070;
      box-shadow: 0 0 30px rgba(230, 32, 112, 0.6);
      transform: scale(1.05);
    }

    .hero-title {
      font-size: 4.5rem;
      line-height: 1.1;
      background: linear-gradient(to right, #fff, #e62070);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .hero-title { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="artwork-particles" id="particle-container"></div>

  <header>
    <nav>
      <div class="logo" style="font-weight: 700; letter-spacing: 1px;">
        MA <span style="color: #e62070;">XW</span> ART.
      </div>
      <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main style="max-width: 1000px; margin: 15vh auto; text-align: center; padding: 0 20px;">

    <div style="margin-bottom: 20px; opacity: 0.6; letter-spacing: 5px; font-size: 0.9rem; color: white;">
        DIGITAL ARCHITECT & MODELER
    </div>

    <h1 class="hero-title">SHAPING<br>VIRTUAL REALITY</h1>

    <p style="font-size: 1.4rem; color: #bbb; margin-bottom: 50px; font-weight: 300; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">
      Hi, I'm <span style="color: #fff; font-weight: 700;">Xiaowen Ma</span>. <br>
      Building immersive 3D experiences from the ground up.
    </p>

    <a href="projects.html" class="btn-custom">
      VIEW MY GALLERY
    </a>

    <div style="margin-top: 100px; opacity: 0.3;">
        <div style="width: 2px; height: 50px; background: linear-gradient(to bottom, #e62070, transparent); margin: 0 auto;"></div>
    </div>
  </main>

  <footer style="margin-top: 50px; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.05); text-align: center;">
    <p style="margin-bottom: 10px;">
        <a href="contact.html" style="color: #888; text-decoration: none; font-size: 0.9rem; transition: 0.3s;" onmouseover="this.style.color='#e62070'" onmouseout="this.style.color='#888'">GET IN TOUCH</a>
    </p>
    <p style="color: #555; font-size: 0.8rem;">&copy; 2026 Xiaowen Ma. All rights reserved.</p>
  </footer>

  <script>
    // 1. 鼠标跟随红光逻辑
    const glow = document.querySelector('.bg-glow');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(230, 32, 112, 0.15) 0%, transparent 50%)`;
    });

    // 2. 核心：纸片艺术粒子管理器
    const container = document.getElementById('particle-container');
    const imageSources = [
      'assets/cover.jpg', 'assets/cover1.jpg', 'assets/cover2.jpg', 'assets/cover3.jpg',
      'assets/cover4.jpg', 'assets/cover5.jpg', 'assets/cover6.jpg', 'assets/cover7.jpg'
    ];
    const particles = [];
    const maxParticles = 18; // 屏幕上同时存在的最大粒子数，根据性能调整

    // 创建粒子的函数
    function createParticle() {
      if (particles.length >= maxParticles) return; // 达到最大数量则不创建

      const img = document.createElement('img');
      // 随机选择一张画作
      img.src = imageSources[Math.floor(Math.random() * imageSources.length)];
      img.className = 'artwork-particle';
      img.alt = 'Artwork Piece';

      // 核心：全画幅不裁剪 (contain)
      img.style.objectFit = 'contain';

      // 1. 随机化基础属性
      const size = 15 + Math.random() * 10; // 随机大小：15%-25% 屏幕宽度
      img.style.width = `${size}vw`;

      const startX = Math.random() * 100; // 随机起始位置 (X轴)
      img.style.left = `${startX}%`;
      const startY = Math.random() * 100; // 随机起始位置 (Y轴)
      img.style.top = `${startY}%`;

      const rotate = (Math.random() - 0.5) * 60; // 随机旋转角：-30度 到 30度
      img.style.transform = `rotate(${rotate}deg) scale(0.2)`; // 初始缩小

      container.appendChild(img);
      particles.push(img);

      // 2. 动画触发：淡入和漫游起点
      // 使用 setTimeout 确保 DOM 渲染后再添加类
      setTimeout(() => {
        img.classList.add('active');
        // 核心：漫游动画路径
