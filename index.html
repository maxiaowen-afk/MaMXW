  <style>
    body {
      background: #0a0a0a;
      font-family: 'Urbanist', sans-serif;
      overflow-x: hidden;
      margin: 0;
    }

    /* 鼠标交互光晕层 - 提高 z-index 确保叠加在背景图之上 */
    .bg-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 32, 112, 0.15) 0%, transparent 50%);
      z-index: 1;
      pointer-events: none;
    }

    /* 屏保艺术背景图容器 */
    .screensaver-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0; /* 放在最底层 */
      pointer-events: none;
      overflow: hidden;
    }

    /* 单张背景图片样式 */
    .screensaver-bg img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保证图片比例完美，裁剪不变形 */
      opacity: 0; /* 初始全部隐藏 */
      transition: opacity 2s ease-in-out; /* 2秒的平滑淡入淡出效果 */
    }

    /* 让第一张默认显示 */
    .screensaver-bg img.active {
      opacity: 0.23; /* 控制背景图的最高透明度，20%-25% 视觉效果最神秘高级 */
    }

    /* 核心内容容器 - 提升 z-index 确保文字和按钮在图片上层，可正常点击 */
    header, main, footer {
      position: relative;
      z-index: 2;
    }

    .btn-custom {
      position: relative;
      padding: 18px 45px;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: transparent;
      border: 2px solid #e62070;
      border-radius: 50px;
      transition: 0.4s;
      font-weight: 700;
      display: inline-block;
      overflow: hidden;
    }

    .btn-custom:hover {
      background: #e62070;
      box-shadow: 0 0 30px rgba(230, 32, 112, 0.6);
      transform: scale(1.05);
    }

    .hero-title {
      font-size: 4.5rem;
      line-height: 1.1;
      background: linear-gradient(to right, #fff, #e62070);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .hero-title { font-size: 2.5rem; }
    }
  </style>
</head>
