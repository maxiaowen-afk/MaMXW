<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Xiaowen Ma</title>
  <link rel="stylesheet" href="MaMXW.css">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;700&display=swap" rel="stylesheet">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body { background: #0a0a0a; font-family: 'Urbanist', sans-serif; color: white; margin: 0; overflow-x: hidden; }
    .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(230, 32, 112, 0.15) 0%, transparent 50%); z-index: -1; pointer-events: none; }

    header { padding: 20px 0; }
    nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .nav-links { display: flex; list-style: none; gap: 30px; }
    .nav-links a { color: white; text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; transition: 0.3s; }
    .nav-links a:hover { color: #e62070; }
    .logo { font-weight: 700; text-decoration: none; color: white; letter-spacing: 1px; }

    .project-btn {
      padding: 15px 25px; cursor: pointer; background: transparent; color: white;
      border: 2px solid #e62070; border-radius: 50px; font-weight: bold;
      font-size: 0.9rem; letter-spacing: 1px; transition: 0.4s;
      flex: 1; max-width: 250px; min-width: 200px; text-transform: uppercase;
    }
    .project-btn:hover { background: #e62070; box-shadow: 0 0 25px rgba(230, 32, 112, 0.6); transform: translateY(-3px); }

    .gallery-space {
      perspective: 1200px;
      margin-top: 50px;
      display: none;
    }

    .gallery-wall {
      position: relative;
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.8) 0%, rgba(10, 10, 10, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      transform: rotateX(2deg);
      transform-style: preserve-3d;
      animation: wallAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes wallAppear {
      from { opacity: 0; transform: rotateX(10deg) translateY(30px); }
      to { opacity: 1; transform: rotateX(2deg) translateY(0); }
    }

    .digital-display {
      position: relative;
      width: 100%;
      height: 580px; /* 轻微加高展示区，给PDF更多纵向延伸空间 */
      background: #000;
      border-radius: 12px;
      border: 3px solid #e62070;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 1), 0 0 30px rgba(230, 32, 112, 0.3);
      overflow: hidden;
    }

    /* 核心修复：确保大屏显示组件能无缝填满黑框 */
    .display-screen {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      animation: screenBoot 0.5s ease-out;
    }

    @keyframes screenBoot {
      from { opacity: 0; filter: brightness(2); }
      to { opacity: 1; filter: brightness(1); }
    }

    .process-section { text-align: left; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(230, 32, 112, 0.2); }
    .process-title { color: #e62070; font-size: 1.4rem; margin-bottom: 15px; font-weight: 700; letter-spacing: 1px; }
    .process-item p { font-size: 1rem; line-height: 1.7; color: #ccc; font-weight: 300; white-space: pre-line; margin: 0; }

    .close-btn { margin-top: 30px; background: transparent; border: 1px solid #444; color: #888; cursor: pointer; padding: 10px 25px; border-radius: 5px; transition: 0.3s; }
    .close-btn:hover { color: white; border-color: #e62070; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header>
    <nav>
      <a href="index.html" class="logo">MA <span style="color: #e62070;">XW</span> ART.</a>
      <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main style="max-width: 1100px; margin: 40px auto; padding: 0 20px; text-align: center;">
    <h1 style="font-size: 3rem; margin-bottom: 40px; letter-spacing: 2px; font-weight: 700;">SELECTED WORKS</h1>

    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
        <button onclick="updateGallery('2d')" class="project-btn">PROJECT 01: 2D
